<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Hub — South Zone Command Center</title>
    <meta name="description" content="Petpooja South Zone Training Command Center — Unified Operational Intelligence Platform" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #0F1117;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      .splash-logo {
        width: 64px; height: 64px;
        background: linear-gradient(135deg, #F97316, #EA580C);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px;
        margin-bottom: 20px;
        box-shadow: 0 0 40px rgba(249,115,22,0.4);
      }
      .splash-title {
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .splash-sub {
        color: #6B7280;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        margin-bottom: 32px;
      }
      .splash-bar {
        width: 200px; height: 3px;
        background: #1F2937;
        border-radius: 99px;
        overflow: hidden;
      }
      .splash-fill {
        height: 100%;
        background: linear-gradient(90deg, #F97316, #EA580C);
        border-radius: 99px;
        animation: load 1.8s ease-in-out forwards;
      }
      @keyframes load {
        0%   { width: 0%; }
        60%  { width: 75%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-logo">🎯</div>
      <div class="splash-title">Training Hub</div>
      <div class="splash-sub">South Zone Command Center</div>
      <div class="splash-bar"><div class="splash-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() { splash.remove(); }, 400);
          }
        }, 600);
      });
    </script>
  </body>
</html>
